name: sync-marketplace-pins

# marketplace.json pins robobuilder-pro and robobuilder-lite to a specific
# version, and nothing updated that pin automatically -- a Pro or Lite patch
# release used to sit unreflected here until someone remembered to bump it by
# hand. That happened twice in the same week this workflow was written for.
#
# This polls those repos' published versions on a schedule and opens (and, if
# the repo allows it, merges) a PR when they drift. Deliberately a poll rather
# than a cross-repo dispatch: it needs no secret beyond the default
# GITHUB_TOKEN, since robobuilder-pro and robobuilder-lite are public and
# their plugin.json is readable unauthenticated.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-marketplace-pins
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read what robobuilder-pro and robobuilder-lite actually publish
        id: latest
        run: |
          set -euo pipefail
          fetch_version() {
            local repo="$1"
            local v
            v=$(curl -fsSL "https://raw.githubusercontent.com/Robo-Co-op/${repo}/main/.claude-plugin/plugin.json" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${repo} returned an unparseable version: '${v}'"
              exit 1
            fi
            printf '%s' "$v"
          }
          echo "pro=$(fetch_version robobuilder-pro)" >> "$GITHUB_OUTPUT"
          echo "lite=$(fetch_version robobuilder-lite)" >> "$GITHUB_OUTPUT"

      - name: Update the pins if they drifted
        id: update
        env:
          PRO_V: ${{ steps.latest.outputs.pro }}
          LITE_V: ${{ steps.latest.outputs.lite }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib

          path = pathlib.Path(".claude-plugin/marketplace.json")
          data = json.loads(path.read_text())
          wanted = {"robobuilder-pro": os.environ["PRO_V"], "robobuilder-lite": os.environ["LITE_V"]}

          changed = []
          for plugin in data["plugins"]:
              target = wanted.get(plugin["name"])
              if target and plugin.get("version") != target:
                  changed.append(f"{plugin['name']} {plugin.get('version')} -> {target}")
                  plugin["version"] = target

          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          print("changed=" + ("1" if changed else "0"))
          print("summary=" + "; ".join(changed))
          PY

      - name: Open a PR with the bump
        if: steps.update.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "robobuilder-bot"
          git config user.email "actions@users.noreply.github.com"
          branch="bot/sync-marketplace-pins-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git add .claude-plugin/marketplace.json
          git commit -m "Sync marketplace pins: ${SUMMARY}"
          git push -u origin "$branch"
          body=$'Automated. robobuilder-pro and/or robobuilder-lite published a version this catalog\'s pin did not reflect yet, so `marketplace.json` was serving a stale version to every session that resolves plugins through it.\n\nOnly the `version` fields for `robobuilder-pro` and `robobuilder-lite` were changed, and only after the fetched value was confirmed to look like a real version number -- a broken or empty response upstream fails this run instead of committing garbage.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'
          gh pr create --title "Sync marketplace pins: ${SUMMARY}" \
            --base main --head "$branch" \
            --body "$body"
          gh pr merge "$branch" --auto --squash \
            || echo "::notice::Auto-merge isn't enabled on this repo, or the PR isn't mergeable yet -- it's open for manual merge."
