name: sync-marketplace-pins

# marketplace.json pins robobuilder-pro and robobuilder-lite to a specific
# version, and nothing updated that pin automatically -- a Pro or Lite patch
# release used to sit unreflected here until someone remembered to bump it by
# hand. That happened twice in the same week this workflow was written for.
#
# This polls those repos' published versions on a schedule and commits a bump
# directly to main when they drift. Deliberately a poll rather than a
# cross-repo dispatch: it needs no secret beyond the default GITHUB_TOKEN,
# since robobuilder-pro and robobuilder-lite are public and their plugin.json
# is readable unauthenticated.
#
# Originally opened a PR and tried to auto-merge it. That failed on every one
# of its first four scheduled runs: "GitHub Actions is not permitted to
# create or approve pull requests" is a repo/org setting the workflow's own
# token scopes (contents: write, pull-requests: write) can't override, and
# nobody noticed for 18 hours because a failed cron run is quiet by design.
# The change is narrow enough (two version strings, only after each is
# confirmed to look like real semver) that a direct commit is a better fit
# than a permission this repo doesn't grant: main here carries no branch
# protection, so there was never a review gate to preserve.
#
# The pin isn't the only place a version number lives -- site/claims.json and
# the two site/*/index.html pages restate it, and their own test suite
# (test_site_claims.py) fails loudly if that copy drifts from the pin. This
# workflow updates all three together and runs that suite before pushing, so
# a bad fetch or a malformed page fails the run instead of landing on main
# red. That happened once already: this workflow's own PR-based first
# version and a same-day site PR each merged green independently, and only
# combined into a stale claim -- exactly the failure class this repo's tests
# exist to catch, missed because nothing had run them against the merge of
# the two.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: sync-marketplace-pins
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pytest

      - name: Read what robobuilder-pro and robobuilder-lite actually publish
        id: latest
        run: |
          set -euo pipefail
          fetch_version() {
            local repo="$1"
            local v
            v=$(curl -fsSL "https://raw.githubusercontent.com/Robo-Co-op/${repo}/main/.claude-plugin/plugin.json" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${repo} returned an unparseable version: '${v}'"
              exit 1
            fi
            printf '%s' "$v"
          }
          echo "pro=$(fetch_version robobuilder-pro)" >> "$GITHUB_OUTPUT"
          echo "lite=$(fetch_version robobuilder-lite)" >> "$GITHUB_OUTPUT"

      - name: Update the pins and the site's copy together, if they drifted
        id: update
        env:
          PRO_V: ${{ steps.latest.outputs.pro }}
          LITE_V: ${{ steps.latest.outputs.lite }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, re

          wanted = {"robobuilder-pro": os.environ["PRO_V"], "robobuilder-lite": os.environ["LITE_V"]}
          claim_id = {"robobuilder-pro": "pro_version", "robobuilder-lite": "lite_version"}

          marketplace_path = pathlib.Path(".claude-plugin/marketplace.json")
          marketplace = json.loads(marketplace_path.read_text())

          changed = []
          new_values = {}
          for plugin in marketplace["plugins"]:
              target = wanted.get(plugin["name"])
              if target and plugin.get("version") != target:
                  changed.append(f"{plugin['name']} {plugin.get('version')} -> {target}")
                  plugin["version"] = target
                  new_values[claim_id[plugin["name"]]] = target

          if changed:
              marketplace_path.write_text(json.dumps(marketplace, indent=2, ensure_ascii=False) + "\n")

              claims_path = pathlib.Path("site/claims.json")
              claims = json.loads(claims_path.read_text())
              for cid, value in new_values.items():
                  claims[cid]["value"] = value
              claims_path.write_text(json.dumps(claims, indent=2, ensure_ascii=False) + "\n")

              # Every data-claim="<id>">...< span on both site pages restates the
              # figure as literal text; test_site_claims.py checks the rendered
              # text against the claim, so both must move together.
              for page in [pathlib.Path("site/index.html"), pathlib.Path("site/ja/index.html")]:
                  html = page.read_text()
                  for cid, value in new_values.items():
                      html = re.sub(
                          rf'(data-claim="{re.escape(cid)}"[^>]*>)[^<]*(<)',
                          rf'\g<1>{value}\g<2>',
                          html,
                      )
                  page.write_text(html)

          print("changed=" + ("1" if changed else "0"))
          print("summary=" + "; ".join(changed))
          PY

      - name: Verify the site's own claims about itself before trusting the commit
        if: steps.update.outputs.changed == '1'
        run: python3 -m pytest scripts/tests/ -q

      - name: Commit and push directly to main
        if: steps.update.outputs.changed == '1'
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "robobuilder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .claude-plugin/marketplace.json site/claims.json site/index.html site/ja/index.html
          git commit -m "Sync marketplace pins: ${SUMMARY}"
          git push origin HEAD:main
